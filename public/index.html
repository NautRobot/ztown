<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Personal Cloud</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #121212;
            color: #ffffff;
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
        }
        .btn {
            background-color: #2563eb;
            color: white;
            padding: 15px 30px;
            border: none;
            border-radius: 8px;
            font-size: 18px;
            cursor: pointer;
            text-decoration: none;
            font-weight: bold;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        .btn:hover {
            background-color: #1d4ed8;
        }
    </style>
    <script src="/uv/uv.bundle.js" defer></script>
    <script src="uv/uv.config.js" defer></script>
</head>
<body>
    <button class="btn" onclick="launchProxy()">Launch</button>

    <script>
        async function launchProxy() {
            if ('serviceWorker' in navigator) {
                await navigator.serviceWorker.register('/uv/uv.sw.js', {
                    scope: __uv$config.prefix
                });

                const targetUr = "https://bunk.town";
                window.location.href = __uv$config.prefix + __uv$config.encodeUrl(targetUrl);
            } else {
                alert("Security settings mad");
            }
        }
    </script>
</body>
</html>
